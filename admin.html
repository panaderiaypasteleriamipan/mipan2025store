<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración E-commerce | MiPan 2025</title>
    
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { 500: '#8b5a2b', 600: '#734821', 900: '#3a210d' }
                    },
                    fontFamily: { sans: ['Public Sans', 'sans-serif'] }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 font-sans text-gray-800 h-screen flex overflow-hidden relative selection:bg-brand-500 selection:text-white">

    <div class="absolute inset-0 bg-gradient-to-br from-gray-100 to-gray-200 pointer-events-none z-0"></div>

    <!-- Sidebar Lateral -->
    <aside class="w-72 bg-brand-900 text-white flex flex-col hidden md:flex relative z-10 shadow-2xl">
        <div class="p-8 text-center border-b border-white/10">
            <h2 class="text-2xl font-bold text-amber-500 tracking-tight">MiPan <span class="font-light text-white">2025</span></h2>
            <p class="text-xs text-amber-200/60 mt-1 uppercase tracking-widest">Admin Dashboard</p>
        </div>
        <nav class="flex-1 p-6 space-y-3 overflow-y-auto">
            <a href="index.html" class="block px-4 py-3 hover:bg-white/5 rounded-xl text-sm font-medium flex items-center gap-4 transition-all duration-300">
                <i class="fa-solid fa-chart-pie w-5 text-center text-amber-500/70"></i> Dashboard
            </a>
            <a href="#" class="block px-4 py-3 bg-brand-600 rounded-xl text-sm font-semibold flex items-center gap-4 shadow-lg shadow-brand-900/50">
                <i class="fa-solid fa-boxes-stacked w-5 text-center text-white"></i> Gestión de Inventario
            </a>
            <a href="catalogo.html" class="block px-4 py-3 hover:bg-white/5 rounded-xl text-sm font-medium flex items-center gap-4 transition-all duration-300">
                <i class="fa-solid fa-store w-5 text-center text-amber-500/70"></i> Vista de Tienda
            </a>
        </nav>
        <div class="p-6 border-t border-white/10">
            <div class="bg-white/5 rounded-xl p-4 flex justify-between items-center border border-white/10">
                <span class="text-xs text-gray-300">Tasa Mercado</span>
                <strong id="sidebarBcvRate" class="text-emerald-400 font-mono tracking-tight"><i class="fa-solid fa-circle-notch fa-spin"></i></strong>
            </div>
        </div>
    </aside>

    <!-- Contenido Principal -->
    <main class="flex-1 flex flex-col overflow-hidden relative z-10">
        
        <header class="bg-white/80 backdrop-blur-md shadow-sm border-b border-gray-200 px-8 py-5 flex justify-between items-center z-20">
            <div class="flex items-center gap-4">
                <button class="md:hidden text-gray-500 hover:text-brand-600 transition"><i class="fa-solid fa-bars text-xl"></i></button>
                <div>
                    <h1 class="text-2xl font-bold text-gray-900 tracking-tight">Inventario y Catálogo</h1>
                    <p class="text-xs text-gray-500 mt-1">Conexión 24/7 activa al mercado cambiario</p>
                </div>
            </div>
            <button onclick="openModal()" class="bg-gray-900 hover:bg-black text-white px-5 py-2.5 rounded-xl text-sm font-semibold shadow-md flex items-center gap-2 transition-all duration-300 transform hover:-translate-y-0.5">
                <i class="fa-solid fa-plus text-xs"></i> Añadir Producto
            </button>
        </header>

        <div class="flex-1 overflow-auto p-8 relative">
            <div id="loaderState" class="absolute inset-0 z-10 flex items-center justify-center bg-gray-50/80 backdrop-blur-sm">
                <div class="flex flex-col items-center gap-3">
                    <i class="fa-solid fa-circle-notch fa-spin text-4xl text-brand-500"></i>
                    <span class="text-sm font-medium text-gray-600">Cargando datos...</span>
                </div>
            </div>

            <div class="bg-white rounded-2xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-gray-100 overflow-hidden">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-50/50 text-gray-500 text-[11px] uppercase tracking-widest border-b border-gray-100">
                            <th class="p-5 w-20 text-center font-semibold">Media</th>
                            <th class="p-5 font-semibold">Producto</th>
                            <th class="p-5 font-semibold">Categoría</th>
                            <th class="p-5 text-right font-semibold">Precio USD</th>
                            <th class="p-5 text-right font-semibold">Equivalente Bs</th>
                            <th class="p-5 text-center font-semibold">Stock</th>
                            <th class="p-5 text-center font-semibold">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="inventoryTable" class="divide-y divide-gray-50 text-sm">
                        <!-- Renderizado dinámico -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Modal Formulario -->
    <div id="productModal" class="fixed inset-0 bg-gray-900/40 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50 overflow-y-auto transition-opacity opacity-0 duration-300">
        <div class="bg-white rounded-2xl w-full max-w-4xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh] transform scale-95 transition-transform duration-300" id="modalContent">
            
            <div class="px-8 py-5 border-b border-gray-100 flex justify-between items-center bg-white">
                <h3 class="font-bold text-xl text-gray-900 tracking-tight" id="modalTitle">Nuevo Registro de Producto</h3>
                <button onclick="closeModal()" class="text-gray-400 hover:text-gray-800 transition-colors bg-gray-100 hover:bg-gray-200 rounded-full w-8 h-8 flex items-center justify-center">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <div class="p-8 overflow-y-auto flex-1 bg-gray-50/30">
                <form id="productForm" onsubmit="saveProduct(event)">
                    <input type="hidden" id="prodId">
                    
                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-10">
                        <div class="lg:col-span-2 space-y-6">
                            <div>
                                <label class="block text-[11px] uppercase tracking-wider font-bold text-gray-500 mb-2">Nombre del Producto</label>
                                <input type="text" id="prodName" required class="w-full p-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-brand-500 outline-none transition-all text-sm font-medium">
                            </div>

                            <div class="grid grid-cols-2 gap-6">
                                <div>
                                    <label class="block text-[11px] uppercase tracking-wider font-bold text-gray-500 mb-2">Precio Referencia</label>
                                    <div class="relative">
                                        <span class="absolute left-4 top-3 text-gray-400 font-medium">$</span>
                                        <input type="number" id="prodPrice" step="0.01" required oninput="calculateBsPreview()" class="w-full pl-8 p-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-emerald-500 outline-none text-sm font-bold text-emerald-700">
                                    </div>
                                </div>
                                <div>
                                    <label class="block text-[11px] uppercase tracking-wider font-bold text-gray-500 mb-2">Equivalente BCV</label>
                                    <div class="w-full p-3 rounded-xl border border-transparent bg-gray-100 text-sm font-bold text-gray-600 flex items-center">
                                        Bs. <span id="previewBs" class="ml-1">0.00</span>
                                    </div>
                                </div>
                            </div>

                            <div class="grid grid-cols-2 gap-6">
                                <div>
                                    <label class="block text-[11px] uppercase tracking-wider font-bold text-gray-500 mb-2">Stock Inicial</label>
                                    <input type="number" id="prodStock" required min="0" class="w-full p-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-brand-500 outline-none text-sm">
                                </div>
                                <div>
                                    <label class="block text-[11px] uppercase tracking-wider font-bold text-gray-500 mb-2">Categoría</label>
                                    <select id="prodCategory" required class="w-full p-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-brand-500 outline-none text-sm">
                                        <option value="panes">Panadería Artesanal</option>
                                        <option value="dulces">Pastelería & Dulces</option>
                                        <option value="navidad">Especiales Navideños</option>
                                    </select>
                                </div>
                            </div>

                            <div>
                                <label class="block text-[11px] uppercase tracking-wider font-bold text-gray-500 mb-2">Descripción Comercial</label>
                                <textarea id="prodDesc" rows="4" class="w-full p-3 rounded-xl border border-gray-200 focus:ring-2 focus:ring-brand-500 outline-none text-sm resize-none"></textarea>
                            </div>
                        </div>

                        <div class="bg-white p-6 rounded-2xl border border-gray-100 shadow-sm flex flex-col h-full relative">
                            <label class="block text-[11px] uppercase tracking-wider font-bold text-gray-500 mb-2">Sincronización de Imagen</label>
                            <input type="hidden" id="prodImageName"> 
                            
                            <label class="relative flex-1 border-2 border-dashed border-gray-200 rounded-xl bg-gray-50 hover:bg-gray-100 hover:border-brand-400 transition-all cursor-pointer flex flex-col items-center justify-center overflow-hidden group">
                                <img id="imgPreview" src="" class="absolute inset-0 w-full h-full object-cover hidden z-10">
                                <div id="imgPlaceholder" class="text-center p-6 z-0">
                                    <div class="w-12 h-12 bg-white rounded-full shadow-sm flex items-center justify-center mx-auto mb-3 text-gray-400">
                                        <i class="fa-solid fa-cloud-arrow-up text-xl"></i>
                                    </div>
                                    <p class="text-sm font-semibold text-gray-700">Haz clic para subir</p>
                                </div>
                                <input type="file" id="imageFileSelector" class="hidden" accept="image/*" onchange="processLocalFile(this)">
                            </label>
                        </div>
                    </div>
                </form>
            </div>

            <div class="px-8 py-5 border-t border-gray-100 bg-white flex justify-end gap-3">
                <button type="button" onclick="closeModal()" class="px-6 py-2.5 bg-white border border-gray-200 text-gray-600 font-semibold rounded-xl text-sm hover:bg-gray-50">Cancelar</button>
                <button type="submit" form="productForm" id="submitBtn" class="px-6 py-2.5 bg-gray-900 text-white font-semibold rounded-xl text-sm hover:bg-black flex items-center justify-center min-w-[160px]">
                    <span id="btnText">Guardar Producto</span>
                </button>
            </div>
        </div>
    </div>

    <div id="toastContainer" class="fixed bottom-6 right-6 z-50 flex flex-col gap-3"></div>

    <script>
        let products = [];
        let bcvRate = parseFloat(localStorage.getItem('mipan_bcv_rate')) || 0.00; 
        let fileToUpload = null; 

        window.addEventListener('DOMContentLoaded', async () => {
            await fetchBCVRate();
            await loadProductsFromServer();
        });

        // --- NUEVA API 24/7 DOLARAPI ---
        async function fetchBCVRate() {
            const rateDisplay = document.getElementById('sidebarBcvRate');
            rateDisplay.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i>';
            
            try {
                // Endpoint directo de DolarApi para mercado oficial
                const response = await fetch('https://ve.dolarapi.com/v1/dolares/oficial');
                
                if (!response.ok) throw new Error('Servidor cambiario no disponible');
                
                const data = await response.json();
                
                // DolarApi devuelve la propiedad "promedio" con la tasa oficial
                if (data && data.promedio) {
                    bcvRate = parseFloat(data.promedio);
                    localStorage.setItem('mipan_bcv_rate', bcvRate);
                    showToast(`Tasa del mercado actualizada: ${bcvRate} Bs`);
                } else {
                    throw new Error('Estructura de respuesta inválida');
                }
            } catch (error) {
                console.error("Error API:", error);
                showToast('Usando última tasa guardada offline', 'red');
            } finally {
                rateDisplay.innerText = bcvRate.toFixed(2) + ' Bs';
                if (products.length > 0) renderTable();
            }
        }

        async function loadProductsFromServer() {
            const loader = document.getElementById('loaderState');
            try {
                await new Promise(resolve => setTimeout(resolve, 300)); 
                products = JSON.parse(localStorage.getItem('mipan_products')) || [];
                renderTable();
            } catch (error) {
                console.error(error);
            } finally {
                loader.classList.add('hidden');
            }
        }

        function renderTable() {
            const tbody = document.getElementById('inventoryTable');
            if (products.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="text-center p-12 text-gray-400">Sin productos.</td></tr>`;
                return;
            }

            tbody.innerHTML = products.map(p => {
                const priceBs = (p.priceUsd * bcvRate).toFixed(2);
                const stockStyle = p.stock > 5 ? 'bg-emerald-50 text-emerald-700' : 'bg-red-50 text-red-700';
                
                return `
                    <tr class="hover:bg-gray-50/50">
                        <td class="p-4 text-center">
                            <div class="w-14 h-14 rounded-xl border bg-white overflow-hidden">
                                <img src="${p.image}" onerror="this.src='https://placehold.co/150'" class="w-full h-full object-cover">
                            </div>
                        </td>
                        <td class="p-4 font-bold text-gray-900">${p.name}</td>
                        <td class="p-4"><span class="bg-gray-100 text-gray-600 px-2 py-1 rounded-md text-xs">${p.category}</span></td>
                        <td class="p-4 text-right font-bold text-emerald-600">$${p.priceUsd.toFixed(2)}</td>
                        <td class="p-4 text-right font-medium">Bs. ${priceBs}</td>
                        <td class="p-4 text-center"><span class="px-3 py-1 rounded-full text-xs font-bold ${stockStyle}">${p.stock}</span></td>
                        <td class="p-4 text-center">
                            <button onclick="editProduct('${p.id}')" class="text-blue-600 w-8 h-8"><i class="fa-solid fa-pen"></i></button>
                            <button onclick="deleteProduct('${p.id}')" class="text-red-600 w-8 h-8"><i class="fa-solid fa-trash"></i></button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function processLocalFile(input) {
            if (input.files && input.files[0]) {
                fileToUpload = input.files[0]; 
                document.getElementById('prodImageName').value = fileToUpload.name;
                const reader = new FileReader();
                reader.onload = function(e) {
                    const preview = document.getElementById('imgPreview');
                    preview.src = e.target.result;
                    preview.classList.remove('hidden');
                    document.getElementById('imgPlaceholder').classList.add('hidden');
                }
                reader.readAsDataURL(fileToUpload);
            }
        }

        async function saveProduct(e) {
            e.preventDefault();
            const id = document.getElementById('prodId').value || 'prod-' + Date.now();
            let finalImageRoute = document.getElementById('prodImageName').value;

            if (fileToUpload) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    finalImageRoute = event.target.result;
                    saveData(id, finalImageRoute);
                };
                reader.readAsDataURL(fileToUpload);
            } else {
                saveData(id, finalImageRoute);
            }
        }

        function saveData(id, imageRoute) {
            const productData = {
                id: id,
                name: document.getElementById('prodName').value.trim(),
                category: document.getElementById('prodCategory').value,
                priceUsd: parseFloat(document.getElementById('prodPrice').value),
                stock: parseInt(document.getElementById('prodStock').value),
                image: imageRoute,
                desc: document.getElementById('prodDesc').value.trim()
            };

            const existingIndex = products.findIndex(p => p.id === id);
            if (existingIndex > -1) products[existingIndex] = productData;
            else products.unshift(productData);
            
            localStorage.setItem('mipan_products', JSON.stringify(products));
            showToast('Guardado correctamente');
            renderTable();
            closeModal();
        }

        function deleteProduct(id) {
            if (confirm('¿Eliminar producto?')) {
                products = products.filter(p => p.id !== id);
                localStorage.setItem('mipan_products', JSON.stringify(products));
                renderTable();
            }
        }

        function openModal() {
            document.getElementById('productForm').reset();
            document.getElementById('prodId').value = '';
            document.getElementById('imgPreview').classList.add('hidden');
            document.getElementById('imgPlaceholder').classList.remove('hidden');
            document.getElementById('productModal').classList.remove('hidden', 'opacity-0');
        }

        function editProduct(id) {
            const p = products.find(prod => prod.id === id);
            if (!p) return;
            openModal(); 
            document.getElementById('prodId').value = p.id;
            document.getElementById('prodName').value = p.name;
            document.getElementById('prodPrice').value = p.priceUsd;
            document.getElementById('prodStock').value = p.stock;
            document.getElementById('prodCategory').value = p.category;
            document.getElementById('prodDesc').value = p.desc;
            
            if (p.image) {
                document.getElementById('imgPreview').src = p.image;
                document.getElementById('imgPreview').classList.remove('hidden');
                document.getElementById('imgPlaceholder').classList.add('hidden');
            }
            calculateBsPreview();
        }

        function closeModal() {
            document.getElementById('productModal').classList.add('hidden');
        }

        function calculateBsPreview() {
            const usd = parseFloat(document.getElementById('prodPrice').value) || 0;
            document.getElementById('previewBs').innerText = (usd * bcvRate).toFixed(2);
        }

        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            const isError = type === 'red';
            toast.className = `p-4 rounded-lg shadow-xl text-white ${isError ? 'bg-red-500' : 'bg-gray-900'} min-w-[250px] mb-2`;
            toast.innerHTML = `<span class="font-medium text-sm">${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }
    </script>
</body>
</html>
