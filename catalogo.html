<!DOCTYPE html>
<html lang="es" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo | mipan2025</title>
    
    <!-- Tailwind CSS (via CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Configuración personalizada de Tailwind -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        classic: {
                            500: '#d97706', // Tono ámbar/dorado premium
                            600: '#b45309',
                        }
                    },
                    fontFamily: {
                        serif: ['Merriweather', 'serif'],
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <!-- FontAwesome (Iconos) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Merriweather:wght@700;900&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 font-sans min-h-screen flex flex-col">

    <!-- Header / Navbar -->
    <header class="bg-white dark:bg-gray-800 shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex justify-between items-center">
            <h1 class="font-serif text-2xl font-black text-classic-500 tracking-tight">mipan2025</h1>
            <button class="relative p-2 text-gray-600 dark:text-gray-300 hover:text-classic-500 transition-colors">
                <i class="fa-solid fa-cart-shopping text-xl"></i>
                <span class="absolute top-0 right-0 inline-flex items-center justify-center px-2 py-1 text-xs font-bold leading-none text-white transform translate-x-1/4 -translate-y-1/4 bg-red-600 rounded-full">0</span>
            </button>
        </div>
    </header>

    <!-- Sección Interactiva del Catálogo -->
    <main id="catalogo" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-10 flex-1 w-full">
        
        <!-- Título de Sección y Barra de Filtros -->
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-6">
            <div>
                <h3 class="font-serif text-2xl sm:text-3xl font-bold text-gray-900 dark:text-white">
                    Catálogo de Productos
                </h3>
                <p class="text-sm text-gray-600 dark:text-gray-400 mt-1">
                    Sincronizado en tiempo real con la administración de mipan2025.
                </p>
            </div>

            <!-- Botones de Filtro -->
            <div id="categoryFilters" class="flex flex-wrap items-center gap-2">
                <button onclick="filterCategory('todos', this)" class="cat-btn bg-classic-500 text-white border-classic-500 shadow-md px-4 py-2 rounded-full text-xs font-bold tracking-wide border transition-all">Todos</button>
                <button onclick="filterCategory('panes', this)" class="cat-btn bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-200 border-gray-300 dark:border-gray-700 px-4 py-2 rounded-full text-xs font-bold tracking-wide border hover:border-classic-500 hover:text-classic-500 transition-all">🥖 Panes</button>
                <button onclick="filterCategory('tortas_dulces', this)" class="cat-btn bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-200 border-gray-300 dark:border-gray-700 px-4 py-2 rounded-full text-xs font-bold tracking-wide border hover:border-classic-500 hover:text-classic-500 transition-all">🍰 Tortas y Dulces</button>
                <button onclick="filterCategory('dulces_secos', this)" class="cat-btn bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-200 border-gray-300 dark:border-gray-700 px-4 py-2 rounded-full text-xs font-bold tracking-wide border hover:border-classic-500 hover:text-classic-500 transition-all">🍪 Dulces Secos</button>
                <button onclick="filterCategory('navideno', this)" class="cat-btn bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-200 border-gray-300 dark:border-gray-700 px-4 py-2 rounded-full text-xs font-bold tracking-wide border hover:border-classic-500 hover:text-classic-500 transition-all">🎄 Especial Navideño</button>
                <button onclick="filterCategory('viveres', this)" class="cat-btn bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-200 border-gray-300 dark:border-gray-700 px-4 py-2 rounded-full text-xs font-bold tracking-wide border hover:border-classic-500 hover:text-classic-500 transition-all">🥫 Víveres</button>
                <button onclick="filterCategory('otros', this)" class="cat-btn bg-white dark:bg-gray-800 text-gray-700 dark:text-gray-200 border-gray-300 dark:border-gray-700 px-4 py-2 rounded-full text-xs font-bold tracking-wide border hover:border-classic-500 hover:text-classic-500 transition-all">📦 Otros</button>
            </div>
        </div>

        <!-- Barra de Búsqueda -->
        <div class="mb-8 w-full max-w-lg">
            <div class="relative w-full group">
                <input type="text" oninput="handleSearch(this.value)" placeholder="Buscar en el catálogo..." class="w-full pl-11 pr-4 py-3 rounded-xl border border-gray-300 dark:border-gray-700 dark:bg-gray-800/80 text-sm focus:outline-none focus:ring-2 focus:ring-classic-500 shadow-sm transition-all group-hover:shadow-md">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-3.5 text-gray-400 group-focus-within:text-classic-500 transition-colors"></i>
            </div>
        </div>

        <!-- Grid Dinámico de Productos (Inicialmente en blanco) -->
        <div id="productGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            <!-- Renderizado dinámico vía JavaScript -->
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-white dark:bg-gray-800 border-t border-gray-200 dark:border-gray-700 mt-auto">
        <div class="max-w-7xl mx-auto px-4 py-6 text-center text-sm text-gray-500">
            &copy; 2026 mipan2025. Sistema de Catálogo Integrado.
        </div>
    </footer>

    <!-- Lógica de Funcionamiento -->
    <script>
        // 1. Consumo EXCLUSIVO de datos provenientes de admin.html
        // Inicia como un array vacío si admin.html no ha guardado nada aún
        let products = JSON.parse(localStorage.getItem('mipan_products')) || [];
        let currentCategory = 'todos';
        let searchQuery = '';

        // Escuchar cambios en otras pestañas (por si admin.html guarda datos mientras esta pestaña está abierta)
        window.addEventListener('storage', function(e) {
            if (e.key === 'mipan_products') {
                products = JSON.parse(e.newValue) || [];
                renderProducts();
            }
        });

        // 2. Función optimizada para filtrado visual de categorías
        function filterCategory(cat, btnElement) {
            currentCategory = cat;
            
            // Reseteo de clases visuales en todos los botones
            const buttons = document.querySelectorAll('.cat-btn');
            buttons.forEach(btn => {
                btn.classList.remove('bg-classic-500', 'text-white', 'border-classic-500', 'shadow-md');
                btn.classList.add('bg-white', 'dark:bg-gray-800', 'text-gray-700', 'dark:text-gray-200', 'border-gray-300', 'dark:border-gray-700');
            });

            // Activar visualmente el botón seleccionado
            if(btnElement) {
                btnElement.classList.remove('bg-white', 'dark:bg-gray-800', 'text-gray-700', 'dark:text-gray-200', 'border-gray-300', 'dark:border-gray-700');
                btnElement.classList.add('bg-classic-500', 'text-white', 'border-classic-500', 'shadow-md');
            }

            renderProducts();
        }

        // 3. Función de búsqueda por texto
        function handleSearch(query) {
            searchQuery = query.toLowerCase().trim();
            renderProducts();
        }

        // 4. Motor de Renderizado en el DOM
        function renderProducts() {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = ''; // Limpiar grilla

            // Aplicar filtros concurrentes (Categoría + Búsqueda)
            const filteredProducts = products.filter(p => {
                const matchCategory = currentCategory === 'todos' || p.category === currentCategory;
                // Prevenir errores si alguna propiedad no existe
                const productName = p.name ? p.name.toLowerCase() : '';
                const productDesc = p.desc ? p.desc.toLowerCase() : '';
                
                const matchSearch = productName.includes(searchQuery) || productDesc.includes(searchQuery);
                return matchCategory && matchSearch;
            });

            // Manejo de estado vacío (cuando no hay productos de admin.html o no coinciden con la búsqueda)
            if (filteredProducts.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full py-16 flex flex-col items-center justify-center text-gray-500 dark:text-gray-400">
                        <i class="fa-solid fa-box-open text-5xl mb-4 opacity-50"></i>
                        <p class="text-lg font-medium">El catálogo está vacío.</p>
                        <p class="text-sm mt-2">Los productos agregados desde la administración aparecerán aquí.</p>
                    </div>
                `;
                return;
            }

            // Inyección de tarjetas HTML basadas en los datos de admin.html
            filteredProducts.forEach(p => {
                const imgPlaceholder = 'https://via.placeholder.com/600x400?text=Sin+Imagen';
                // Usamos la imagen en Base64 o URL que venga de admin.html, o un placeholder si no tiene
                const imageSrc = p.image || p.fallbackImg || imgPlaceholder; 
                
                const card = document.createElement('div');
                card.className = 'bg-white dark:bg-gray-800 rounded-2xl shadow-sm hover:shadow-xl transition-all duration-300 overflow-hidden border border-gray-100 dark:border-gray-700 flex flex-col group';
                
                card.innerHTML = `
                    <div class="aspect-w-4 aspect-h-3 w-full overflow-hidden bg-gray-100 dark:bg-gray-900 relative">
                        <img src="${imageSrc}" alt="${p.name}" class="w-full h-48 object-cover object-center group-hover:scale-105 transition-transform duration-500">
                        ${p.stock <= 0 ? `<div class="absolute inset-0 bg-black bg-opacity-50 flex items-center justify-center"><span class="text-white font-bold px-3 py-1 bg-red-600 rounded-full text-sm">Agotado</span></div>` : ''}
                    </div>
                    <div class="p-5 flex flex-col flex-1">
                        <div class="flex justify-between items-start mb-2">
                            <h4 class="text-lg font-bold text-gray-900 dark:text-white leading-tight">${p.name}</h4>
                        </div>
                        <p class="text-sm text-gray-500 dark:text-gray-400 mb-4 flex-1 line-clamp-2">${p.desc || 'Sin descripción.'}</p>
                        <div class="flex items-center justify-between mt-auto pt-4 border-t border-gray-100 dark:border-gray-700">
                            <span class="text-xl font-black text-gray-900 dark:text-white">$${parseFloat(p.priceUsd || 0).toFixed(2)}</span>
                            <button onclick="añadirAlCarrito('${p.id}')" ${p.stock <= 0 ? 'disabled' : ''} class="w-10 h-10 rounded-full flex items-center justify-center transition-all ${p.stock > 0 ? 'bg-classic-500 hover:bg-classic-600 text-white shadow-md hover:shadow-lg transform hover:-translate-y-0.5' : 'bg-gray-300 text-gray-500 cursor-not-allowed'}">
                                <i class="fa-solid fa-plus"></i>
                            </button>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // 5. Simulación de añadir al carrito
        function añadirAlCarrito(id) {
            const producto = products.find(p => p.id === id);
            if(producto) {
                // Efecto visual simple para el badge del carrito
                const cartBadge = document.querySelector('header span');
                let count = parseInt(cartBadge.innerText);
                cartBadge.innerText = count + 1;
                cartBadge.classList.add('animate-bounce');
                setTimeout(() => cartBadge.classList.remove('animate-bounce'), 1000);
            }
        }

        // Inicializar la vista al cargar el documento
        document.addEventListener('DOMContentLoaded', renderProducts);
    </script>
</body>
</html>
